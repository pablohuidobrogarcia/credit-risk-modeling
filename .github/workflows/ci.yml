name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The unit tests run on synthetic data and do not need the raw dataset.
          # Heavy tree libraries are optional for the test suite, so they are
          # installed only if available (LightGBM wheels exist on all runners).
          pip install numpy pandas scipy scikit-learn statsmodels duckdb pyarrow \
                      matplotlib pyyaml pytest lightgbm

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests

      - name: Run tests
        run: python -m pytest -q
