  </g></a>

  <a href="#debt_consolidation" id="debt_consolidation" data-category="debt_consolidation"><g class="hex" style="--c:#b388ff" transform="translate(473 216)">
    <title>Debt Consolidation</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-debt_consolidation" class="ic" transform="translate(0 -24)"/>
    <text class="lbl" y="22"><tspan x="0">Debt</tspan><tspan x="0" dy="15">Consolidation</tspan></text>
  </g></a>

  <a href="#major_purchase" id="major_purchase" data-category="major_purchase"><g class="hex" style="--c:#f78fb3" transform="translate(619 216)">
    <title>Major Purchase</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-major_purchase" class="ic" transform="translate(0 -24)"/>
    <text class="lbl" y="22"><tspan x="0">Major</tspan><tspan x="0" dy="15">Purchase</tspan></text>
  </g></a>

  <!-- ============ FILA 3 ============ -->
  <a href="#home_improvement" id="home_improvement" data-category="home_improvement"><g class="hex" style="--c:#f4a261" transform="translate(108 342)">
    <title>Home Improvement</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-home_improvement" class="ic" transform="translate(0 -24)"/>
    <text class="lbl" y="22"><tspan x="0">Home</tspan><tspan x="0" dy="15">Improvement</tspan></text>
  </g></a>

  <a href="#car" id="car" data-category="car"><g class="hex" style="--c:#4895ef" transform="translate(254 342)">
    <title>Car</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-car" class="ic" transform="translate(0 -20)"/>
    <text class="lbl" y="34"><tspan x="0">Car</tspan></text>
  </g></a>

  <a href="#credit_card" id="credit_card" data-category="credit_card"><g class="hex" style="--c:#0ca678" transform="translate(400 342)">
    <title>Credit Card</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-credit_card" class="ic" transform="translate(0 -24)"/>
    <text class="lbl" y="22"><tspan x="0">Credit</tspan><tspan x="0" dy="15">Card</tspan></text>
