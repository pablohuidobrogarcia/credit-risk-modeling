<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1200 380" width="1200" height="380" class="home-ownership-svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .home-ownership-svg .card { cursor: pointer; outline: none; }
    .home-ownership-svg .card .bg { fill: #ffffff; stroke-width: 3; transition: fill .15s, stroke-width .15s; }
    .home-ownership-svg .card:hover .bg, .home-ownership-svg .card:focus .bg { stroke-width: 6; }
    .home-ownership-svg #rent:hover .bg, .home-ownership-svg #rent:focus .bg { fill: #e8f1f7; }
    .home-ownership-svg #own:hover .bg, .home-ownership-svg #own:focus .bg { fill: #e6f5ee; }
    .home-ownership-svg #mortgage:hover .bg, .home-ownership-svg #mortgage:focus .bg { fill: #f0eaf8; }
    .home-ownership-svg #any:hover .bg, .home-ownership-svg #any:focus .bg { fill: #eceff1; }
    .home-ownership-svg .label { font-size: 28px; font-weight: 800; letter-spacing: 1px; text-anchor: middle; }
    .home-ownership-svg .sub { font-size: 13px; fill: #666; text-anchor: middle; }
  </style>

  <rect width="1200" height="440" fill="#ffffff"/>

  <!-- ================= RENT ================= -->
  <a href="#rent" id="rent" class="card" data-category="RENT">
    <title>RENT</title>
    <rect class="bg" x="55" y="60" width="250" height="340" rx="18" stroke="#2a6f97"/>
    <g transform="translate(180 0)" stroke="#2a6f97" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-62" y="100" width="90" height="130" rx="6" fill="#d6e8f3"/>
      <g fill="#fff" stroke-width="3">
        <rect x="-48" y="116" width="18" height="18"/><rect x="-4" y="116" width="18" height="18"/>
        <rect x="-48" y="146" width="18" height="18"/><rect x="-4" y="146" width="18" height="18"/>
        <rect x="-48" y="176" width="18" height="18"/><rect x="-4" y="176" width="18" height="18"/>
      </g>
      <rect x="-26" y="200" width="24" height="30" fill="#2a6f97"/>
      <!-- llave -->
      <g fill="none">
        <circle cx="62" cy="130" r="14"/>
        <line x1="62" y1="144" x2="62" y2="200"/>
        <line x1="62" y1="176" x2="74" y2="176"/>
        <line x1="62" y1="190" x2="72" y2="190"/>
      </g>
    </g>
    <text class="label" x="180" y="300" fill="#2a6f97">RENT</text>
  </a>

  <!-- ================= OWN ================= -->
  <a href="#own" id="own" class="card" data-category="OWN">
    <title>OWN</title>
    <rect class="bg" x="335" y="60" width="250" height="340" rx="18" stroke="#2f9e6e"/>
    <g transform="translate(460 0)" stroke="#2f9e6e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="-70,150 0,90 70,150" fill="#bfe6d3"/>
      <rect x="-55" y="150" width="110" height="80" fill="#d9f0e5"/>
      <rect x="-14" y="180" width="28" height="50" fill="#2f9e6e"/>
      <rect x="-45" y="168" width="22" height="22" fill="#fff" stroke-width="3"/>
      <rect x="23" y="168" width="22" height="22" fill="#fff" stroke-width="3"/>
      <!-- insignia de propiedad -->
      <circle cx="58" cy="105" r="20" fill="#2f9e6e" stroke="#fff" stroke-width="3"/>
      <path d="M48 105 L55 112 L68 97" fill="none" stroke="#fff" stroke-width="5"/>
    </g>
    <text class="label" x="460" y="300" fill="#2f9e6e">OWN</text>
  </a>

  <!-- ================= MORTGAGE ================= -->
  <a href="#mortgage" id="mortgage" class="card" data-category="MORTGAGE">
    <title>MORTGAGE</title>
    <rect class="bg" x="615" y="60" width="250" height="340" rx="18" stroke="#7b4fb3"/>
    <g transform="translate(740 0)" stroke="#7b4fb3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="-70,150 -5,95 60,150" fill="#ddd0f0"/>
      <rect x="-55" y="150" width="100" height="80" fill="#ebe3f7"/>
      <rect x="-30" y="180" width="26" height="50" fill="#7b4fb3"/>
      <!-- moneda % -->
      <circle cx="50" cy="205" r="30" fill="#fff"/>
      <text x="50" y="216" text-anchor="middle" font-size="32" font-weight="800" fill="#7b4fb3" stroke="none">%</text>
    </g>
    <text class="label" x="740" y="300" fill="#7b4fb3">MORTGAGE</text>
  </a>

  <!-- ================= ANY ================= -->
  <a href="#any" id="any" class="card" data-category="ANY">
    <title>ANY</title>
    <rect class="bg" x="895" y="60" width="250" height="340" rx="18" stroke="#6c757d"/>
    <g transform="translate(1020 0)" stroke="#6c757d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8">
      <polygon points="-70,150 0,90 70,150" fill="#f1f3f5"/>
      <rect x="-55" y="150" width="110" height="80" fill="#f8f9fa"/>
    </g>
    <text x="1020" y="212" text-anchor="middle" font-size="56" font-weight="800" fill="#6c757d">?</text>
    <text class="label" x="1020" y="300" fill="#6c757d">ANY</text>
  </a>
</svg>
