<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 432" width="800" height="432" class="loan-purpose-honeycomb" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#16213e"/>
      <stop offset="1" stop-color="#080c18"/>
    </radialGradient>

    <polygon id="hexshape" points="0,-78 67.5,-39 67.5,39 0,78 -67.5,39 -67.5,-39"/>

    <!-- Iconos: heredan trazo/relleno del elemento que los usa -->
    <g id="ic-small_business">
      <path d="M-20 -6 L-16 -20 H16 L20 -6 Q15 2 10 -6 Q5 2 0 -6 Q-5 2 -10 -6 Q-15 2 -20 -6 Z"/>
      <path d="M-16 -1 V18 H16 V-1"/>
      <rect x="-5" y="4" width="10" height="14"/>
    </g>
    <g id="ic-renewable_energy">
      <circle cx="0" cy="-4" r="3" fill="currentColor"/>
      <line x1="0" y1="-4" x2="0" y2="-24"/>
      <line x1="0" y1="-4" x2="-17" y2="6"/>
      <line x1="0" y1="-4" x2="17" y2="6"/>
      <path d="M0 -1 V22 M-9 22 H9"/>
    </g>
    <g id="ic-house">
      <path d="M-22 -2 L0 -22 L22 -2"/>
      <path d="M-16 -6 V20 H16 V-6"/>
      <rect x="-5" y="4" width="10" height="16"/>
    </g>
    <g id="ic-moving">
      <rect x="-22" y="-14" width="26" height="22"/>
      <path d="M4 -6 H14 L22 2 V8 H4 Z"/>
      <circle cx="-11" cy="12" r="4.5" fill="currentColor"/>
      <circle cx="14" cy="12" r="4.5" fill="currentColor"/>
    </g>
    <g id="ic-medical">
      <path d="M-6 -22 H6 V-6 H22 V6 H6 V22 H-6 V6 H-22 V-6 H-6 Z"/>
    </g>
    <g id="ic-other">
      <circle cx="0" cy="0" r="22"/>
      <circle cx="-10" cy="0" r="2.6" fill="currentColor"/>
      <circle cx="0" cy="0" r="2.6" fill="currentColor"/>
      <circle cx="10" cy="0" r="2.6" fill="currentColor"/>
    </g>
    <g id="ic-vacation">
      <path d="M-22 -4 A22 20 0 0 1 22 -4 Z"/>
      <line x1="0" y1="-4" x2="0" y2="20"/>
      <path d="M-16 23 Q0 15 16 23"/>
    </g>
    <g id="ic-debt_consolidation">
      <line x1="-22" y1="-16" x2="-2" y2="0"/>
      <line x1="-22" y1="0" x2="-2" y2="0"/>
      <line x1="-22" y1="16" x2="-2" y2="0"/>
      <line x1="-2" y1="0" x2="20" y2="0"/>
      <polyline points="12,-8 20,0 12,8"/>
    </g>
    <g id="ic-major_purchase">
      <rect x="-17" y="-8" width="34" height="30" rx="3"/>
      <path d="M-8 -8 V-14 A8 8 0 0 1 8 -14 V-8"/>
    </g>
    <g id="ic-home_improvement">
      <g transform="rotate(45)">
        <rect x="-3.5" y="-4" width="7" height="30"/>
        <rect x="-15" y="-16" width="30" height="12" fill="currentColor"/>
      </g>
    </g>
    <g id="ic-car">
      <path d="M-24 8 V-1 L-16 -3 L-9 -14 H9 L16 -3 L24 -1 V8 Z"/>
      <circle cx="-12" cy="9" r="5.5" fill="currentColor"/>
      <circle cx="12" cy="9" r="5.5" fill="currentColor"/>
    </g>
    <g id="ic-credit_card">
      <rect x="-24" y="-15" width="48" height="30" rx="4"/>
      <rect x="-24" y="-8" width="48" height="8" fill="currentColor"/>
      <line x1="-17" y1="8" x2="-5" y2="8"/>
    </g>
    <g id="ic-wedding">
      <circle cx="-9" cy="6" r="12"/>
      <circle cx="9" cy="6" r="12"/>
      <polygon points="0,-24 6,-17 0,-10 -6,-17" fill="currentColor"/>
    </g>
    <g id="ic-educational">
      <polygon points="0,-18 -25,-7 0,4 25,-7"/>
      <path d="M-13 -1 V11 Q0 19 13 11 V-1"/>
      <line x1="25" y1="-7" x2="25" y2="9"/>
    </g>
  </defs>

  <style>
    .loan-purpose-honeycomb .hex { cursor: pointer; outline: none; }
    .loan-purpose-honeycomb .hex .bg { fill: #f8f9fc; stroke: var(--c); stroke-width: 3; transition: fill .15s, stroke-width .15s; }
    .loan-purpose-honeycomb .hex .ic { color: var(--c); stroke: var(--c); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .loan-purpose-honeycomb .hex .lbl { font-size: 12px; font-weight: 700; fill: #1f2937; text-anchor: middle; letter-spacing: .3px; }
    .loan-purpose-honeycomb .hex:hover .bg, .loan-purpose-honeycomb .hex:focus .bg { fill: var(--c); stroke-width: 5; }
    .loan-purpose-honeycomb .hex:hover .ic, .loan-purpose-honeycomb .hex:focus .ic { color: #080c18; stroke: #080c18; }
    .loan-purpose-honeycomb .hex:hover .lbl, .loan-purpose-honeycomb .hex:focus .lbl { fill: #080c18; }
  </style>

  <rect width="800" height="432" fill="#ffffff"/>

  <!-- ============ FILA 1 ============ -->
  <a href="#small_business" id="small_business" data-category="small_business"><g class="hex" style="--c:#ffb703" transform="translate(108 90)">
    <title>Small Business</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-small_business" class="ic" transform="translate(0 -24)"/>
    <text class="lbl" y="22"><tspan x="0">Small</tspan><tspan x="0" dy="15">Business</tspan></text>
  </g></a>

  <a href="#renewable_energy" id="renewable_energy" data-category="renewable_energy"><g class="hex" style="--c:#12b886" transform="translate(254 90)">
    <title>Renewable Energy</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-renewable_energy" class="ic" transform="translate(0 -24)"/>
    <text class="lbl" y="22"><tspan x="0">Renewable</tspan><tspan x="0" dy="15">Energy</tspan></text>
  </g></a>

  <a href="#house" id="house" data-category="house"><g class="hex" style="--c:#4cc9f0" transform="translate(400 90)">
    <title>House</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-house" class="ic" transform="translate(0 -20)"/>
    <text class="lbl" y="34"><tspan x="0">House</tspan></text>
  </g></a>

  <a href="#moving" id="moving" data-category="moving"><g class="hex" style="--c:#ff7a59" transform="translate(546 90)">
