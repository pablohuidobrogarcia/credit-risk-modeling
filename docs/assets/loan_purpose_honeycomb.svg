    <title>Medical</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-medical" class="ic" transform="translate(0 -20)"/>
    <text class="lbl" y="34"><tspan x="0">Medical</tspan></text>
  </g></a>

  <!-- ============ FILA 2 ============ -->
  <a href="#other" id="other" data-category="other"><g class="hex" style="--c:#8795a8" transform="translate(181 216)">
    <title>Other</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-other" class="ic" transform="translate(0 -20)"/>
    <text class="lbl" y="34"><tspan x="0">Other</tspan></text>
  </g></a>

  <a href="#vacation" id="vacation" data-category="vacation"><g class="hex" style="--c:#f5b700" transform="translate(327 216)">
    <title>Vacation</title>
    <use href="#hexshape" class="bg"/>
    <use href="#ic-vacation" class="ic" transform="translate(0 -22)"/>
